# Workers: scan, stamp and read files from the queues. More of them drain a
# backlog faster; RabbitMQ shares the work.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: worker }
  template:
    metadata:
      labels: { app.kubernetes.io/name: worker }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9091"
    spec:
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      # Let a file being scanned finish before the pod goes.
      terminationGracePeriodSeconds: 120
      containers:
        - name: worker
          image: delios-backend
          env:
            - { name: Delios__Role, value: worker }
          envFrom:
            - configMapRef: { name: delios-config }
            - secretRef: { name: delios-secrets }
          ports:
            - { name: http, containerPort: 8080 }
            - { name: metrics, containerPort: 9091 }
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 15
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 30
          startupProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 5
            failureThreshold: 24
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { memory: 2Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: {} }]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: worker
spec:
  minAvailable: 1
  selector: { matchLabels: { app.kubernetes.io/name: worker } }
