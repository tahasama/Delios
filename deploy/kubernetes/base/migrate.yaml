# Runs the database migrations once per release, before the new pods roll out:
#   kubectl -n delios delete job migrate --ignore-not-found && kubectl apply -k <overlay>
#   kubectl -n delios wait --for=condition=complete job/migrate --timeout=10m
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels: { app.kubernetes.io/name: migrate }
    spec:
      restartPolicy: Never
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: migrate
          image: delios-backend
          args: ["migrate"]
          envFrom:
            - configMapRef: { name: delios-config }
            - secretRef: { name: delios-secrets }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: {} }]
