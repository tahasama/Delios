# HTTPS in front of the API. The host is set by the overlay; the certificate
# comes from cert-manager. Health stays inside the cluster (the probes reach the pods
# directly), as Caddy keeps it in compose: each call runs the database, queue and
# cache checks, and nobody outside needs them.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: delios
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: nginx
  tls:
    - hosts: [app.example.com]
      secretName: delios-tls
  rules:
    - host: app.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend: { service: { name: api, port: { name: http } } }
