# The virus scanner the workers stream every upload through.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clamav
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: clamav }
  template:
    metadata:
      labels: { app.kubernetes.io/name: clamav }
    spec:
      containers:
        - name: clamav
          image: clamav/clamav:stable
          # clamd refuses streams over 25 MB by default; drawings and scans are larger.
          command: ["/bin/sh", "-c"]
          args:
            - >-
              grep -q '^StreamMaxLength' /etc/clamav/clamd.conf ||
              printf 'StreamMaxLength 2048M\nMaxFileSize 2048M\nMaxScanSize 4096M\n' >> /etc/clamav/clamd.conf;
              exec /init
          ports: [{ name: clamd, containerPort: 3310 }]
          readinessProbe:
            tcpSocket: { port: clamd }
            initialDelaySeconds: 60
            periodSeconds: 15
          resources:
            requests: { cpu: 200m, memory: 1536Mi }
            limits: { memory: 3Gi }
          volumeMounts: [{ name: signatures, mountPath: /var/lib/clamav }]
      volumes: [{ name: signatures, emptyDir: {} }]
---
apiVersion: v1
kind: Service
metadata:
  name: clamav
spec:
  selector: { app.kubernetes.io/name: clamav }
  ports: [{ name: clamd, port: 3310, targetPort: clamd }]
