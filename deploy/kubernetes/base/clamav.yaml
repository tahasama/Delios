# The virus scanner the workers stream every upload through.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clamav
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: clamav }
  template:
    metadata:
      labels: { app.kubernetes.io/name: clamav }
    spec:
      # Not runAsNonRoot: the image starts as root only to write its settings, then runs clamd and freshclam as its own
      # clamav user. What a container may gain is still closed: no privilege escalation, the runtime's system-call filter.
      # nosemgrep: yaml.kubernetes.security.run-as-non-root.run-as-non-root
      securityContext: { seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: clamav
          image: clamav/clamav:stable
          # clamd refuses streams over 25 MB by default; drawings and scans are larger. What it cannot look into (locked by a
          # password, more inside than it opens) it reports, and the app refuses it in plain words (FileScanning).
          command: ["/bin/sh", "-c"]
          args:
            - >-
              grep -q '^StreamMaxLength' /etc/clamav/clamd.conf ||
              printf 'StreamMaxLength 2048M\nMaxFileSize 2048M\nMaxScanSize 4096M\nAlertEncrypted yes\nAlertExceedsMax yes\n' >> /etc/clamav/clamd.conf;
              exec /init
          securityContext: { allowPrivilegeEscalation: false }
          ports: [{ name: clamd, containerPort: 3310 }]
          readinessProbe:
            tcpSocket: { port: clamd }
            initialDelaySeconds: 60
            periodSeconds: 15
          resources:
            requests: { cpu: 200m, memory: 1536Mi }
            limits: { memory: 3Gi }
          volumeMounts: [{ name: signatures, mountPath: /var/lib/clamav }]
      volumes: [{ name: signatures, emptyDir: {} }]
---
apiVersion: v1
kind: Service
metadata:
  name: clamav
spec:
  selector: { app.kubernetes.io/name: clamav }
  ports: [{ name: clamd, port: 3310, targetPort: clamd }]
