# Email. Fill in the four values marked CHANGE, and put the SMTP password in
# deploy/monitoring/alertmanager/secrets/smtp_password (not committed).
global:
  smtp_smarthost: smtp.example.com:587          # CHANGE: your SMTP server and port
  smtp_from: alerts@example.com                  # CHANGE: the sender address
  smtp_auth_username: alerts@example.com         # CHANGE: the SMTP login
  smtp_auth_password_file: /etc/alertmanager/secrets/smtp_password
  smtp_require_tls: true

route:
  receiver: team
  group_by: [alertname]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    # Scale triggers are not emergencies: one reminder a day is enough.
    - matchers: [severity="plan"]
      receiver: team
      repeat_interval: 24h

inhibit_rules:
  # When a node is down, its slowness is not news.
  - source_matchers: [alertname="ApiDown"]
    target_matchers: [alertname=~"ApiSlow|ServerErrors"]
  - source_matchers: [alertname="PostgresDown"]
    target_matchers: [alertname=~"ApiSlow|ServerErrors|DatabaseConnectionsHigh|BackupTooOld"]

receivers:
  - name: team
    email_configs:
      - to: ops@example.com                      # CHANGE: who receives the alerts
        send_resolved: true
