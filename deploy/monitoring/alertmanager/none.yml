# No notifications are sent: alerts show in Alertmanager (:9093) and Grafana.
# To be notified, set ALERT_CHANNEL to email, telegram, slack or webhook and fill
# in that file. See docs/ACTIVATION.md "Alert notifications".
route:
  receiver: team
  group_by: [alertname]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    # Scale triggers are not emergencies: one reminder a day is enough.
    - matchers: [severity="plan"]
      receiver: team
      repeat_interval: 24h

inhibit_rules:
  # When a node is down, its slowness is not news.
  - source_matchers: [alertname="ApiDown"]
    target_matchers: [alertname=~"ApiSlow|ServerErrors"]
  - source_matchers: [alertname="PostgresDown"]
    target_matchers: [alertname=~"ApiSlow|ServerErrors|DatabaseConnectionsHigh|BackupTooOld"]

receivers:
  - name: team
