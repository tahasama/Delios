# Telegram. Create a bot with @BotFather, put its token in
# deploy/monitoring/alertmanager/secrets/telegram_token (not committed), and put
# the chat's id below.
route:
  receiver: team
  group_by: [alertname]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    # Scale triggers are not emergencies: one reminder a day is enough.
    - matchers: [severity="plan"]
      receiver: team
      repeat_interval: 24h

inhibit_rules:
  # When a node is down, its slowness is not news.
  - source_matchers: [alertname="ApiDown"]
    target_matchers: [alertname=~"ApiSlow|ServerErrors"]
  - source_matchers: [alertname="PostgresDown"]
    target_matchers: [alertname=~"ApiSlow|ServerErrors|DatabaseConnectionsHigh|BackupTooOld"]

receivers:
  - name: team
    telegram_configs:
      - bot_token_file: /etc/alertmanager/secrets/telegram_token
        chat_id: -1000000000000                  # CHANGE: the chat or group id
        send_resolved: true
        parse_mode: HTML
