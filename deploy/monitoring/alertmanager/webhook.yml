# Any service that accepts Alertmanager's webhook JSON (SMS gateways, Microsoft
# Teams through a connector, PagerDuty-style tools). Put the URL in
# deploy/monitoring/alertmanager/secrets/webhook_url (not committed).
route:
  receiver: team
  group_by: [alertname]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    # Scale triggers are not emergencies: one reminder a day is enough.
    - matchers: [severity="plan"]
      receiver: team
      repeat_interval: 24h

inhibit_rules:
  # When a node is down, its slowness is not news.
  - source_matchers: [alertname="ApiDown"]
    target_matchers: [alertname=~"ApiSlow|ServerErrors"]
  - source_matchers: [alertname="PostgresDown"]
    target_matchers: [alertname=~"ApiSlow|ServerErrors|DatabaseConnectionsHigh|BackupTooOld"]

receivers:
  - name: team
    webhook_configs:
      - url_file: /etc/alertmanager/secrets/webhook_url
        send_resolved: true
