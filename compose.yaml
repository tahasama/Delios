# Development stack. Production uses managed object storage and its own secrets.
# Every password comes from .env (next to this file): create it once with  sh deploy/init-env.sh
#
#   docker compose up -d                                       dependencies only; run the API with dotnet run
#   docker compose --profile app up -d                         everything: dependencies, migrations, API, worker
#                                                                and the screens on http://localhost:3080
#   add --scale api=2 --scale worker=2                           more nodes; Caddy and Prometheus find them
#   add --profile monitoring                                     Prometheus :9090, Alertmanager :9093, Grafana :3301

name: delios

x-backend: &backend
  build: ./backend
  image: delios-backend
  restart: unless-stopped
  environment: &backend-env
    # Production at go-live (docs/ACTIVATION.md "Go-live"): refuses demo data, hides error details.
    ASPNETCORE_ENVIRONMENT: ${APP_ENVIRONMENT:-Development}
    # DB_HOST=pgbouncer (with the pgbouncer profile) sends the app through the pool.
    ConnectionStrings__Postgres: Host=${DB_HOST:-postgres};Database=delios;Username=delios;Password=${DB_APP_PASSWORD:?run sh deploy/init-env.sh};${DB_OPTIONS:-}
    # Set to the standby's connection string to read register pages from it.
    ConnectionStrings__PostgresReadOnly: ${DB_READ_CONNECTION:-}
    ConnectionStrings__Redis: valkey:6379
    ConnectionStrings__RabbitMq: amqp://delios:${RABBITMQ_PASSWORD:?run sh deploy/init-env.sh}@rabbitmq:5672/
    # s3 (SeaweedFS here, Hetzner or AWS in production) or azure (docs/ACTIVATION.md "Azure Blob Storage").
    # The second copy of each file, where file-backup keeps it: made as each file is stored.
    Backup__Target: ${FILE_BACKUP_TARGET_TYPE:-local}
    Backup__Path: ${FILE_BACKUP_TARGET_PATH:-/file-backup}
    Backup__Endpoint: ${RCLONE_CONFIG_TARGET_ENDPOINT:-}
    Backup__Region: ${RCLONE_CONFIG_TARGET_REGION:-}
    Backup__AccessKey: ${RCLONE_CONFIG_TARGET_ACCESS_KEY_ID:-}
    Backup__SecretKey: ${RCLONE_CONFIG_TARGET_SECRET_ACCESS_KEY:-}
    Storage__Provider: ${STORAGE_PROVIDER:-s3}
    Storage__AzureConnectionString: ${AZURE_STORAGE_CONNECTION_STRING:-}
    Storage__Endpoint: ${STORAGE_ENDPOINT:-http://seaweedfs:8333}
    Storage__Region: ${STORAGE_REGION:-us-east-1}
    # Presigned links are opened by the screens' server (uploads and downloads pass through it, never the
    # browser), which reaches storage by its name on the Docker network. Only a screens server run outside Docker
    # (`npm run dev`) needs STORAGE_PUBLIC_ENDPOINT=http://localhost:8333.
    Storage__PublicEndpoint: ${STORAGE_PUBLIC_ENDPOINT:-http://seaweedfs:8333}
    Storage__Bucket: ${STORAGE_BUCKET:-delios}
    Storage__AccessKey: ${STORAGE_ACCESS_KEY:?run sh deploy/init-env.sh}
    Storage__SecretKey: ${STORAGE_SECRET_KEY:?run sh deploy/init-env.sh}
    ClamAv__Host: clamav
    # Where the screens are told what changed (their kept answers cleared); never reachable from outside (Caddy).
    Screens__Url: ${SCREENS_URL:-http://web:3000}
    Screens__Secret: ${SCREENS_SECRET:-}
    # Where the screens keep their answers (Valkey's database 1): each change is written there too.
    Screens__CacheDb: "1"
    # Plain HTTP on localhost; production sits behind TLS and keeps the default.
    Auth__SecureCookie: ${SECURE_COOKIE:-false}
    # An organization may register itself from the sign-up page.
    SignUp__Enabled: ${SIGN_UP_ENABLED:-true}
    # Email stays off until a mail server is named. Each kind has its own switch;
    # with email off every message is still recorded in the outbox, marked OFF.
    Email__Enabled: ${EMAIL_ENABLED:-false}
    Email__Transmittals: ${EMAIL_TRANSMITTALS:-true}
    Email__Reviews: ${EMAIL_REVIEWS:-true}
    Email__Notifications: ${EMAIL_NOTIFICATIONS:-true}
    Email__From: ${EMAIL_FROM:-delios@localhost}
    Email__DeliosAddress: ${DELIOS_CONTACT_EMAIL:-}
    Email__BaseUrl: ${PUBLIC_URL:-http://localhost:3080}
    Email__Smtp__Host: ${SMTP_HOST:-}
    Email__Smtp__Port: ${SMTP_PORT:-587}
    Email__Smtp__User: ${SMTP_USER:-}
    Email__Smtp__Password: ${SMTP_PASSWORD:-}
    # Replies by email to transmittals sent to organizations not on DELIOS (docs/ACTIVATION.md, "Replies by email").
    Email__Replies__Address: ${EMAIL_REPLIES_ADDRESS:-}
    Email__Replies__Secret: ${EMAIL_REPLIES_SECRET:-}
    # The bot check on sign-in, sign-up and forgot password (Cloudflare Turnstile); empty: off.
    Turnstile__SecretKey: ${TURNSTILE_SECRET_KEY:-}
    # The address people reach the system at, for single sign-on to send them back to.
    Sso__PublicUrl: ${PUBLIC_URL:-}
    # postgres until RegisterSearchSlow says otherwise; then opensearch (with the search profile).
    Search__Provider: ${SEARCH_PROVIDER:-postgres}
    Search__Url: http://opensearch:9200
    # Empty until the extraction profile runs; then http://tika:9998. Whether an
    # organization's files are read is still its own switch (docs/ACTIVATION.md).
    Extraction__Url: ${EXTRACTION_URL:-}
    Extraction__OcrLanguages: ${OCR_LANGUAGES:-eng}
    # The Preview's converters (docs/gaps/previews.md): office files to PDF, DWG drawings to DXF. Empty: those files
    # are offered to download instead.
    # Office on standby (owner): empty unless switched on, with COMPOSE_PROFILES=app,office and
    # PREVIEW_OFFICE_URL=http://gotenberg:3000 in .env.
    Previews__OfficeUrl: ${PREVIEW_OFFICE_URL:-}
    Previews__DwgUrl: ${PREVIEW_DWG_URL:-http://dwg:8080}

services:
  # Postgres with continuous WAL archiving and scheduled backups (deploy/postgres).
  # In development the backup repository is a volume; production points
  # BACKUP_REPO_TYPE=s3 at storage with another provider or region.
  postgres:
    build: ./deploy/postgres
    image: delios-postgres
    restart: unless-stopped
    init: true
    environment: &postgres-env
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?run sh deploy/init-env.sh}
      # Used only when the data volume is first created (initdb/01-roles.sh).
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?run sh deploy/init-env.sh}
      DB_MONITOR_PASSWORD: ${DB_MONITOR_PASSWORD:?run sh deploy/init-env.sh}
      DB_REPLICATION_PASSWORD: ${DB_REPLICATION_PASSWORD:?run sh deploy/init-env.sh}
      BACKUP_REPO_TYPE: ${BACKUP_REPO_TYPE:-posix}
      BACKUP_CIPHER_PASS: ${BACKUP_CIPHER_PASS:-}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-}
      BACKUP_S3_KEY: ${BACKUP_S3_KEY:-}
      BACKUP_S3_SECRET: ${BACKUP_S3_SECRET:-}
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - postgres:/var/lib/postgresql/data
      - pgbackrest:/var/lib/pgbackrest
      - delios-metrics:/var/lib/delios-metrics
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U delios -d delios"]
      # Asked often only while starting (what waits on it starts as soon as it answers), then every 5 minutes: the
      # answer is only shown once it is up (owner: no check that serves nothing).
      interval: 5m
      start_period: 2m
      start_interval: 2s
      retries: 3

  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    # Within 512 MB: when full, what carries an end (the screens' kept answers, cached sessions) goes first, the least
    # used first; what carries none (the numbers that say access changed, the labels' times) always stays.
    command: ["valkey-server", "--maxmemory", "512mb", "--maxmemory-policy", "volatile-lru"]
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5m
      start_period: 2m
      start_interval: 2s
      retries: 3

  rabbitmq:
    image: rabbitmq:4-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: delios
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?run sh deploy/init-env.sh}
    ports: ["127.0.0.1:5672:5672", "127.0.0.1:15672:15672"]
    volumes: [rabbitmq:/var/lib/rabbitmq]
    healthcheck:
      # Each check starts the queue's own command-line tool: often while starting, then every 5 minutes.
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5m
      start_period: 3m
      start_interval: 3s
      retries: 3

  # S3-compatible store for development only.
  seaweedfs:
    image: chrislusf/seaweedfs:latest
    restart: unless-stopped
    # The access keys come from .env; the config file is written at start.
    environment:
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:?run sh deploy/init-env.sh}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:?run sh deploy/init-env.sh}
    entrypoint:
      - /bin/sh
      - -c
      - >-
        printf '{"identities":[{"name":"delios","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}'
        "$$STORAGE_ACCESS_KEY" "$$STORAGE_SECRET_KEY" > /tmp/s3.json &&
        exec weed server -dir=/data -s3 -s3.config=/tmp/s3.json
    ports: ["127.0.0.1:8333:8333"]
    volumes:
      - seaweedfs:/data

  storage-init:
    image: chrislusf/seaweedfs:latest
    depends_on: [seaweedfs]
    restart: on-failure
    entrypoint:
      - /bin/sh
      - -c
      - >-
        sleep 5 &&
        (echo 's3.bucket.list' | weed shell -master=seaweedfs:9333 | grep -qw delios ||
        echo 's3.bucket.create -name delios' | weed shell -master=seaweedfs:9333 | grep -q 'created bucket')

  clamav:
    image: clamav/clamav:stable
    restart: unless-stopped
    # clamd refuses streams over 25 MB by default; drawings and scans are larger.
    entrypoint:
      - /bin/sh
      - -c
      - >-
        grep -q '^StreamMaxLength' /etc/clamav/clamd.conf ||
        printf 'StreamMaxLength 2048M\nMaxFileSize 2048M\nMaxScanSize 4096M\n' >> /etc/clamav/clamd.conf;
        exec /init
    ports: ["127.0.0.1:3310:3310"]
    volumes: [clamav:/var/lib/clamav]

  migrate:
    <<: *backend
    profiles: [app]
    restart: "no"
    command: ["migrate"]
    environment:
      <<: *backend-env
      # Migrations always talk to Postgres directly, never through the pool.
      ConnectionStrings__Postgres: Host=postgres;Database=delios;Username=delios;Password=${DB_APP_PASSWORD:?run sh deploy/init-env.sh}
    healthcheck: { disable: true }
    depends_on:
      postgres: { condition: service_healthy }

  # API nodes publish no port: everything comes through Caddy, so any number can run.
  api:
    <<: *backend
    profiles: [app]
    environment:
      <<: *backend-env
      Delios__Role: api
    # The second copy of each file is made as it is stored (the weekly comparison in file-backup does the rest).
    volumes: [file-backup:/file-backup]
    depends_on: &after-migrate
      migrate: { condition: service_completed_successfully }
      valkey: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  worker:
    <<: *backend
    profiles: [app]
    environment:
      <<: *backend-env
      Delios__Role: worker
    volumes: [file-backup:/file-backup]
    depends_on: *after-migrate

  # The way in: load-balances the API nodes, and terminates TLS in production.
  caddy:
    image: caddy:2-alpine
    profiles: [app]
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports: ["127.0.0.1:8080:8080", "${HTTP_PORT:-3080}:80", "${HTTPS_PORT:-8443}:443"]
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy:/data
    depends_on: [api]

  # The screens, behind Caddy at SITE_ADDRESS (http://localhost:3080 here).
  # Started with the rest of the app; `npm run dev` is only for changing them.
  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
    image: delios-web
    profiles: [app]
    restart: unless-stopped
    environment:
      DELIOS_API_URL: http://caddy:8080
      # The secret the backend shows when it says what changed (/api/screens/changed).
      DELIOS_SCREENS_SECRET: ${SCREENS_SECRET:-}
      # What the screens keep of the backend's answers, kept in Valkey (frontend/cache-handler.mjs).
      SCREENS_CACHE_REDIS: redis://valkey:6379/1
    depends_on: [caddy, valkey]

  # Compares every stored file with its second copy once a week, copying what is missing (each file is copied as it is
  # stored by the app: Documents/FileBackup.cs).
  file-backup:
    image: rclone/rclone:latest
    profiles: [app]
    restart: unless-stopped
    # Line endings stripped: a Windows checkout may have turned them into CRLF.
    entrypoint: ["/bin/sh", "-c", "tr -d '\\r' < /backup.sh > /tmp/backup.sh && exec sh /tmp/backup.sh"]
    environment:
      # azureblob when the files live in Azure (with the account name and key below).
      RCLONE_CONFIG_SOURCE_TYPE: ${FILE_BACKUP_SOURCE_TYPE:-s3}
      RCLONE_CONFIG_SOURCE_ACCOUNT: ${AZURE_STORAGE_ACCOUNT:-}
      RCLONE_CONFIG_SOURCE_KEY: ${AZURE_STORAGE_KEY:-}
      RCLONE_CONFIG_SOURCE_PROVIDER: Other
      RCLONE_CONFIG_SOURCE_ENDPOINT: ${STORAGE_ENDPOINT:-http://seaweedfs:8333}
      RCLONE_CONFIG_SOURCE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY:?run sh deploy/init-env.sh}
      RCLONE_CONFIG_SOURCE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_KEY:?run sh deploy/init-env.sh}
      SOURCE_PATH: ${STORAGE_BUCKET:-delios}
      # Production: a second S3 remote (RCLONE_CONFIG_TARGET_TYPE=s3 and its keys).
      RCLONE_CONFIG_TARGET_TYPE: ${FILE_BACKUP_TARGET_TYPE:-local}
      TARGET_PATH: ${FILE_BACKUP_TARGET_PATH:-/file-backup}
    volumes:
      - ./deploy/file-backup/backup.sh:/backup.sh:ro
      - file-backup:/file-backup
      - delios-metrics:/var/lib/delios-metrics
    depends_on: [seaweedfs]

  # ── Restore drill (run monthly) ─────────────────────────────────────────────
  #   docker compose --profile drill run --rm restore-drill
  restore-drill:
    image: delios-postgres
    profiles: [drill]
    entrypoint: ["restore-drill.sh"]
    environment: *postgres-env
    volumes:
      - pgbackrest:/var/lib/pgbackrest:ro
      - delios-metrics:/var/lib/delios-metrics

  # ── Standby (switched on before the first contract depends on the system) ───
  # Follows the primary, read-only; serves as the read replica; promoted by hand
  # when the primary is lost (docs/ACTIVATION.md "Promote the standby").
  postgres-standby:
    image: delios-postgres
    profiles: [standby]
    restart: unless-stopped
    init: true
    environment:
      <<: *postgres-env
      DELIOS_PG_ROLE: standby
      PRIMARY_HOST: postgres
      REPLICATION_PASSWORD: ${DB_REPLICATION_PASSWORD:?run sh deploy/init-env.sh}
    ports: ["127.0.0.1:5433:5432"]
    volumes:
      - postgres-standby:/var/lib/postgresql/data
      - pgbackrest:/var/lib/pgbackrest:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U delios -d delios"]
      interval: 5m
      start_period: 5m
      start_interval: 3s
      retries: 3
    depends_on:
      postgres: { condition: service_healthy }

  postgres-exporter-standby:
    image: prometheuscommunity/postgres-exporter:latest
    profiles: [standby]
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: postgresql://delios_monitor:${DB_MONITOR_PASSWORD:?run sh deploy/init-env.sh}@postgres-standby:5432/delios?sslmode=disable

  # ── Connection pool (switched on when DatabaseConnectionsHigh fires) ─────────
  # Many app nodes share a bounded set of Postgres connections. Transaction
  # pooling is safe here because the tenant is set per transaction (SET LOCAL).

  pgbouncer:
    image: edoburu/pgbouncer:latest
    profiles: [pgbouncer]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://delios:${DB_APP_PASSWORD:?run sh deploy/init-env.sh}@postgres:5432/delios
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "2000"
      DEFAULT_POOL_SIZE: "40"
      MAX_PREPARED_STATEMENTS: "200"
    ports: ["127.0.0.1:6432:5432"]
    depends_on:
      postgres: { condition: service_healthy }

  # ── Search index (switched on when RegisterSearchSlow fires) ────────────────
  # Ranked, forgiving search over the register. Holds register entries only, not
  # file content. Postgres stays the truth: the index is rebuilt from it.

  opensearch:
    image: opensearchproject/opensearch:2.19.2
    profiles: [search]
    restart: unless-stopped
    environment:
      discovery.type: single-node
      # Reached only by the API and worker on the private network.
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: -Xms${SEARCH_HEAP:-1g} -Xmx${SEARCH_HEAP:-1g}
    volumes: [opensearch:/usr/share/opensearch/data]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 5m
      start_period: 5m
      start_interval: 5s
      retries: 3

  # ── Content extraction and OCR (installed when a client asks for it) ─────────
  # Apache Tika with Tesseract: reads the text layer of PDFs and Office files, and
  # OCRs pages that are only images. Reached by the worker alone.

  # Word, PowerPoint and their kin turned into a PDF for the Preview (LibreOffice inside), made once per file. On
  # standby (owner): about 1.5 GB and up to 1 GB of memory, for what the revision's PDF already shows. Switched on with
  # the profile office and PREVIEW_OFFICE_URL (above).
  gotenberg:
    image: gotenberg/gotenberg:8
    profiles: [office]
    restart: unless-stopped

  # DWG drawings turned into DXF for the Preview (LibreDWG, the free route; deploy/dwg).
  dwg:
    build: ./deploy/dwg
    image: delios-dwg
    profiles: [app]
    restart: unless-stopped

  tika:
    image: apache/tika:3.2.3.0-full
    profiles: [extraction]
    restart: unless-stopped

  # ── Monitoring ──────────────────────────────────────────────────────────────
  # How we know: metrics, alerts that say what to do, a dashboard. Alerts reach
  # people once ALERT_CHANNEL is set (docs/ACTIVATION.md "Alert notifications").

  prometheus:
    image: prom/prometheus:latest
    profiles: [monitoring]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
    ports: ["127.0.0.1:9090:9090"]
    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus:/prometheus

  alertmanager:
    image: prom/alertmanager:latest
    profiles: [monitoring]
    restart: unless-stopped
    command: ["--config.file=/etc/alertmanager/${ALERT_CHANNEL:-none}.yml", "--storage.path=/alertmanager"]
    ports: ["127.0.0.1:9093:9093"]
    volumes:
      - ./deploy/monitoring/alertmanager:/etc/alertmanager:ro
      - alertmanager:/alertmanager

  grafana:
    image: grafana/grafana:latest
    profiles: [monitoring]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?run sh deploy/init-env.sh}
      GF_USERS_ALLOW_SIGN_UP: "false"
    # 3301 rather than 3001, which other local apps often use.
    ports: ["127.0.0.1:${GRAFANA_PORT:-3301}:3000"]
    volumes:
      - ./deploy/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana:/var/lib/grafana

  node-exporter:
    image: prom/node-exporter:latest
    profiles: [monitoring]
    restart: unless-stopped
    command: ["--path.rootfs=/host", "--collector.textfile.directory=/textfile"]
    pid: host
    volumes:
      - /:/host:ro
      # Backup, file-copy and restore-drill results, written as metrics files.
      - delios-metrics:/textfile:ro

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    profiles: [monitoring]
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: postgresql://delios_monitor:${DB_MONITOR_PASSWORD:?run sh deploy/init-env.sh}@postgres:5432/delios?sslmode=disable

  redis-exporter:
    image: oliver006/redis_exporter:latest
    profiles: [monitoring]
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis://valkey:6379

volumes:
  opensearch:
  pgbackrest:
  delios-metrics:
  file-backup:
  postgres-standby:
  caddy:
  prometheus:
  alertmanager:
  grafana:
  postgres:
  rabbitmq:
  seaweedfs:
  clamav:
