name: backend

# Paused by the owner (30 Oct 2026): a push runs only the quick checks (layout, build). The 155 tests and the whole
# stack run by hand: Actions → backend → "Run workflow".
on:
  push:
    paths: ["backend/**", "deploy/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", "deploy/**", ".github/workflows/backend.yml"]
  workflow_dispatch:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore
      - run: dotnet format --verify-no-changes --no-restore
      - run: dotnet build -c Release --no-restore
      # Integration tests start Postgres, Redis and RabbitMQ with Testcontainers.
      - if: github.event_name == 'workflow_dispatch'
        run: dotnet test -c Release --no-build

  kubernetes:
    # Switched off in production until needed; checked on every push so it is ready when it is.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Render and validate the manifests
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          kubectl kustomize deploy/kubernetes/overlays/production > rendered.yaml
          ./kubeconform -strict -summary rendered.yaml

  image:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: docker build -t delios-backend backend
      - run: docker build -t delios-postgres deploy/postgres
      - run: sh deploy/init-env.sh
      # Start the server's stack from the images just built and require the API and worker to be healthy. The screens,
      # the drawing reader and the file copier are built from their own folders and are not what this job checks.
      - run: docker compose up -d --no-build postgres valkey rabbitmq seaweedfs storage-init clamav migrate api worker caddy
      - name: Wait for api and worker to be healthy
        run: |
          for i in $(seq 1 120); do
            api=$(docker inspect -f '{{.State.Health.Status}}' delios-api-1)
            worker=$(docker inspect -f '{{.State.Health.Status}}' delios-worker-1)
            echo "api=$api worker=$worker"
            [ "$api" = healthy ] && [ "$worker" = healthy ] && break
            sleep 5
          done
          [ "$api" = healthy ] && [ "$worker" = healthy ]
      # Through Caddy: an API path without a session answers 401.
      - run: test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/me)" = 401
      - name: Wait for the first database backup
        run: |
          for i in $(seq 1 60); do
            docker compose logs postgres | grep -q "backup-loop: full backup finished" && exit 0
            sleep 5
          done
          docker compose logs postgres | tail -50
          exit 1
      - name: Archive everything written so far
        # The first backup can finish before the migrations ran; a restore replays
        # the archived log after it, so the schema must be archived before the drill.
        run: |
          c="docker compose exec -T postgres psql -U postgres -d delios -tAc"
          seg=$($c "select pg_walfile_name(pg_switch_wal())")
          for i in $(seq 1 30); do
            [ "$($c "select coalesce(last_archived_wal >= '$seg', false) from pg_stat_archiver")" = t ] && exit 0
            sleep 2
          done
          echo "WAL segment $seg was not archived"; exit 1
      - name: Restore drill against that backup
        run: docker compose --profile drill run --rm restore-drill
      - name: Validate monitoring configuration and alert rules
        run: |
          docker run --rm -v "$PWD/deploy/monitoring:/etc/prometheus" --entrypoint promtool prom/prometheus:latest check config /etc/prometheus/prometheus.yml
          docker run --rm -v "$PWD/deploy/monitoring:/w" -w /w --entrypoint promtool prom/prometheus:latest test rules alerts.test.yml
          for f in none email telegram slack webhook; do
            docker run --rm -v "$PWD/deploy/monitoring/alertmanager:/etc/alertmanager" --entrypoint amtool prom/alertmanager:latest check-config /etc/alertmanager/$f.yml
          done
      - if: failure()
        run: docker compose --profile app logs
